aid: ruhan
name: RuhAN
type: Index
kind: company
visibility: Public
description: >-
  RuhAN (ruhan.co) is a Turkish mining and underground-sciences platform covering mining
  licence workflows, MAPEG and Turkish mining legislation, tender and field reports,
  geology and mineral exploration, geophysics data processing, GIS and remote sensing,
  and the YTK, CED (EIA), technical-supervisor, drilling and field-service market, plus a
  marketplace for sites, ore, equipment, jobs and expert services. It is a Next.js
  application on Vercel and is pre-launch: its own /api/health endpoint reports that the
  Supabase and Gemini backends are not configured, the iyzico payment integration is not
  live, and all seven commerce and privacy documents under /legal are labelled draft
  text. RuhAN publishes no OpenAPI, AsyncAPI, GraphQL SDL, MCP server or agent card. Its
  only machine-readable document is an llms.txt, and its only reachable HTTP surface is
  two undocumented endpoints -- GET /api/health and POST /api/lead.
