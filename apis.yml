apis:
- name: RuhAN Platform
  description: >-
    RuhAN exposes two HTTP endpoints under https://www.ruhan.co/api and publishes no
    contract for either. GET /api/health returns 200 application/json and is named in the
    provider's own llms.txt; on 2026-08-27 it reported ok=true with supabaseConfigured
    and geminiConfigured both false. POST /api/lead is the platform's MVP request form --
    it is not documented anywhere public and was found in the site's client JavaScript
    bundle, then confirmed with an OPTIONS preflight returning "allow: OPTIONS, POST";
    GET returns 405. It was deliberately NOT exercised with a POST, because that would
    submit a real lead. The declared apis.json at /apis.json returns 404. Every OpenAPI,
    Swagger, GraphQL, AsyncAPI, MCP and A2A discovery path in the enrichment contract was
    probed against this host and every one returned 404. Nothing was invented.
    Re-verified 2026-08-27.
