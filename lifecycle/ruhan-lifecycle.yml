status_page:
  published: false
  url: null
  note: >-
    No status.ruhan.co, no statuspage.io/Instatus/BetterStack page, and no status link on
    any RuhAN page. The platform does serve its own liveness endpoint (see health below),
    but a liveness endpoint is not a status page: it reports the process, not incident
    history, and nothing subscribes to it.
health:
  endpoint: https://www.ruhan.co/api/health
  status: 200
  method: GET
  auth: none
  content_type: application/json
  fields_returned:
  - ok
  - app
  - supabaseConfigured
  - geminiConfigured
  observed_2026_08_27:
    ok: true
    app: www.ruhan.co
    supabaseConfigured: false
    geminiConfigured: false
  note: >-
    Declared in the provider's own llms.txt as an important page. The endpoint is a real,
    live, unauthenticated JSON surface. Its own payload reports that the platform's
    database (Supabase) and model (Gemini) backends are NOT configured, which matches the
    homepage form copy: "Bu form MVP omurgasidir. Supabase baglilysa talep kaydedilir;
    Gemini baglilysa ilk on cevap uretilir." (This form is the MVP backbone. If Supabase
    is connected the request is saved; if Gemini is connected a first preliminary answer
    is generated.)
