note: >-
  RuhAN is an early-stage platform, not a deprecated one. Nothing here should be read as
  decay: there is no versioning or deprecation policy because there is not yet a stable
  contract to version. The one concrete defect worth reporting to the provider is that
  /mevzuat -- advertised in llms.txt as an important page and linked from the site nav --
  404s, which sends every agent that reads their llms.txt to a dead route.
