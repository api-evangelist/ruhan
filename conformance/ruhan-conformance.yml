domain_standard:
  market: Turkish mining, licensing and underground sciences
  standard_declared: false
  candidates_checked:
  - id: ogc-wms
    conforms: false
    evidence: >-
      The /map page CONSUMES third-party OGC/ArcGIS services -- a WMS at ahocevar.com and
      an ArcGIS REST protected-areas service at cbs1.tarimorman.gov.tr (Turkish Ministry
      of Agriculture and Forestry). Those are other organisations' endpoints, not RuhAN's,
      and are recorded here only so a later round does not misattribute them. RuhAN
      publishes no WMS, WFS, WMTS or OGC API surface of its own.
  - id: stac
    conforms: false
    evidence: >-
      /odeme names "STAC/COG paketi" as a planned digital-delivery product, which is a
      real domain-standard intent (SpatioTemporal Asset Catalog + Cloud-Optimized GeoTIFF)
      for a remote-sensing platform. It is a product description on a page whose commerce
      flow is not live, not a served catalog: no /stac, /catalog or collection endpoint
      exists. Recorded as intent, scored as absent.
  - id: mapeg
    conforms: false
    evidence: >-
      MAPEG (Maden ve Petrol Isleri Genel Mudurlugu, the Turkish mining regulator) is the
      regulatory regime this platform's entire workflow is built around, and RuhAN's
      content references its legislation directly. MAPEG publishes no machine-readable API
      or exchange schema for licence data, so there is no domain contract available for
      RuhAN to conform to. Reward-only: this is not a penalty, and no conformance was
      invented to fill the slot.
compliance:
  certifications_published: []
  note: >-
    No SOC 2, ISO 27001, PCI DSS or equivalent certification is claimed anywhere.
    probe-security-programs.py returned vdp=none trust=none -- no vulnerability disclosure
    programme and no trust centre. What RuhAN does publish is a Turkish regulatory
    compliance set aimed at consumers, not integrators: KVKK (Turkey's personal-data law,
    /legal/kvkk), a privacy policy, terms of use, a distance-sales contract, a
    pre-information form, a cancellation-refund policy and a digital-delivery/licence
    page. All seven are labelled "Taslak metin" (draft text) and state they will be
    finalised before launch with counsel review and iyzico's onboarding requirements.
    No Compliance pointer is wired into apis.yml: a draft consumer policy set is not a
    published compliance programme.
